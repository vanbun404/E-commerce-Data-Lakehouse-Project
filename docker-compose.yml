services:
  minio:
    image: quay.io/minio/minio
    container_name: ecommerce-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks :
      - lakehouse-net
  iceberg-rest:
    image: apache/iceberg-rest-fixture
    container_name: ecommerce-iceberg-rest

    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

      CATALOG_WAREHOUSE: s3://ecommerce-lakehouse/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    networks:
      - lakehouse-net
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: ecommerce-spark
    depends_on:
      - iceberg-rest
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

    ports:
      - "8888:8888"
      - "8501:8501"
      - "4040:4040"
    networks:
      - lakehouse-net
volumes:
  minio_data:
networks:
  lakehouse-net: